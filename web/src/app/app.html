<nav class="navbar navbar-expand bg-body-tertiary border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/files">Files</a>

    <ul class="navbar-nav me-auto">
      @if (auth.activeAccount()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/files" routerLinkActive="active" i18n="@@nav.files">Archivos</a>
        </li>
      }
    </ul>

    <div class="d-flex align-items-center gap-2">
      <app-language-selector></app-language-selector>

      @if (auth.activeAccount()) {
        <span class="badge text-bg-light border">{{ roleLabel() }}</span>
        <span class="small text-muted d-none d-sm-inline">{{ displayName() }}</span>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="logout()" i18n="@@app.signOut">
          Cerrar sesión
        </button>
      } @else if (auth.isConfigured()) {
        <button type="button" class="btn btn-primary btn-sm" (click)="auth.login()" i18n="@@app.signIn">
          Iniciar sesión
        </button>
      } @else {
        <button type="button" class="btn btn-primary btn-sm" disabled i18n="@@app.signIn">Iniciar sesión</button>
      }
    </div>
  </div>
</nav>

<main class="container-fluid py-4">
  <router-outlet></router-outlet>
</main>

<app-toasts></app-toasts>
