name: files

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: files
      POSTGRES_USER: files
      POSTGRES_PASSWORD: files
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U files -d files"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  flyway:
    image: flyway/flyway:11
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/files
      FLYWAY_USER: files
      FLYWAY_PASSWORD: files
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: migrate

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./infra/local/s3:/etc/localstack/init/ready.d:ro
      - localstackdata:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/local/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Files.Api/Dockerfile
    image: files-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FilesDb: Host=postgres;Port=5432;Database=files;Username=files;Password=files
      Storage__StagingPath: /var/lib/files/staging
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: files-api
    ports:
      - "8080:8080"
    volumes:
      - staging:/var/lib/files/staging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Files.Worker/Dockerfile
    image: files-worker:local
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__FilesDb: Host=postgres;Port=5432;Database=files;Username=files;Password=files
      Storage__StagingPath: /var/lib/files/staging
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: files-worker
    volumes:
      - staging:/var/lib/files/staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: files-web:local
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  localstackdata:
  staging:
