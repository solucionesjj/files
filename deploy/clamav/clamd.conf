# ClamAV daemon for Files. Mounted at /etc/clamav/clamd.conf.
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.ctl
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground false
MaxThreads 4
ReadTimeout 900
CommandReadTimeout 900
# Files supports 5 GiB objects; defaults are far too small and would skip large files.
StreamMaxLength 6G
MaxFileSize 6G
MaxScanSize 8G
AlertExceedsMax yes
