components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entra ID delegated token for a tenant user (scope `Files.Access`).
    integrationAuth:
      type: http
      scheme: bearer
      description: |
        Entra ID application token (preferred) or API key with the form
        `flk_<kid>_<secret>`. The credential is bound to one integration.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque pagination cursor from a previous response.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: Base64url-encoded 256-bit link token.
    GrantToken:
      name: grantToken
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: Base64url-encoded 256-bit download grant token.
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9._-]{3,80}$'
    Locale:
      name: locale
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z]{2}-[A-Z]{2}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Current `version` of the file, e.g. `"3"`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Safe-retry key scoped to the caller, retained 24 hours.
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
      description: HTTP byte range, e.g. `bytes=0-1048575`.

  headers:
    XRequestId:
      description: Correlation ID for support and tracing.
      schema:
        type: string
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
    ETag:
      description: Metadata version used with `If-Match`.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request or validation error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, or expired credential.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or intentionally hidden.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Resource expired or no longer available.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: "`If-Match` does not match the current version."
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Semantically invalid request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit or quota exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependency unavailable or maintenance.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          examples: [file_unavailable]
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Me:
      type: object
      required: [userId, tenantId, displayName, roles, permissions]
      properties:
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: [string, 'null']
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [Files.User, Files.Admin, Files.Auditor]
        permissions:
          type: array
          items:
            type: string

    PortalConfig:
      type: object
      required: [maxFileSizeBytes, retention, features]
      properties:
        maxFileSizeBytes:
          type: integer
          format: int64
        allowedContentTypes:
          type: array
          items:
            type: string
        retention:
          type: object
          required: [defaultDays, maxDays, allowUserOverride, allowIndefinite]
          properties:
            defaultDays:
              type: integer
            maxDays:
              type: integer
            allowUserOverride:
              type: boolean
            allowIndefinite:
              type: boolean
        features:
          type: object
          properties:
            publicLinks:
              type: boolean
            malwareScanning:
              type: boolean

    FileRetention:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [finite, indefinite]
        days:
          type: [integer, 'null']
          minimum: 1
        expiresAt:
          type: [string, 'null']
          format: date-time
      description: |
        `indefinite` has `expiresAt = null`; never a far-future date.
        `days` is the applied policy duration when known.

    FileDownloadStats:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
        lastAt:
          type: [string, 'null']
          format: date-time

    FileOwner:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [human, integration]
        displayName:
          type: [string, 'null']

    FileMetadata:
      type: object
      required: [id, fileName, sizeBytes, contentType, status, accessMode, retention, tags, downloads, scanStatus, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 512
        sizeBytes:
          type: integer
          format: int64
        contentType:
          type: string
        status:
          type: string
          enum: [pending_upload, processing, available, quarantined, expired, pending_deletion, deleted, upload_failed]
        accessMode:
          type: string
          enum: [owner_only, private_link, public_link, integration_only]
        retention:
          $ref: '#/components/schemas/FileRetention'
        tags:
          type: array
          items:
            type: string
        downloads:
          $ref: '#/components/schemas/FileDownloadStats'
        scanStatus:
          type: string
          enum: [not_scanned, pending, clean, infected, failed]
        owner:
          $ref: '#/components/schemas/FileOwner'
        quarantineReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        availableAt:
          type: [string, 'null']
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
        etag:
          type: string
      example:
        id: 0199c2b2-6c3a-7c11-9a9e-0d4b7a8f2c10
        fileName: informe-trimestral.pdf
        sizeBytes: 10485760
        contentType: application/pdf
        status: available
        accessMode: private_link
        retention:
          mode: finite
          days: 365
          expiresAt: '2027-10-23T21:00:00Z'
        tags: [finance, q3]
        downloads:
          count: 4
          lastAt: '2026-10-20T15:12:00Z'
        scanStatus: clean
        owner:
          type: human
          displayName: Ana Pérez
        createdAt: '2026-10-23T20:59:00Z'
        updatedAt: '2026-10-23T21:00:00Z'
        version: 3
        etag: '"3"'

    FileList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileMetadata'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    PresignedPart:
      type: object
      required: [partNumber, url, expiresAt]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    UploadSession:
      type: object
      required: [fileId, uploadSessionId, mode, expiresAt, parts]
      properties:
        fileId:
          type: string
          format: uuid
        uploadSessionId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [single, multipart]
        expiresAt:
          type: string
          format: date-time
        partSizeBytes:
          type: [integer, 'null']
          format: int64
        partCount:
          type: [integer, 'null']
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the client must send to S3 exactly as signed.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PresignedPart'
        presignedUrl:
          type: [string, 'null']
          description: Present only for `single` mode.

    CreateUploadSessionRequest:
      type: object
      required: [fileName, sizeBytes, contentType]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
          minLength: 3
          maxLength: 255
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        retention:
          type: object
          properties:
            mode:
              type: string
              enum: [finite, indefinite]
            days:
              type: [integer, 'null']
              minimum: 1
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64

    CreateIntegrationUploadSessionRequest:
      type: object
      required: [fileName, sizeBytes, contentType]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
          minLength: 3
          maxLength: 255
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'

    PresignPartsRequest:
      type: object
      required: [partNumbers]
      properties:
        partNumbers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PresignedParts:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PresignedPart'

    CompleteUploadRequest:
      type: object
      properties:
        checksumSha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'

    UpdateFileRequest:
      type: object
      minProperties: 1
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        retention:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [finite, indefinite]
            days:
              type: [integer, 'null']
              minimum: 1
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64

    CreateLinkRequest:
      type: object
      required: [accessMode]
      properties:
        accessMode:
          type: string
          enum: [public, private]
        expiresAt:
          type: [string, 'null']
          format: date-time
        maxDownloads:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000

    Link:
      type: object
      required: [id, fileId, accessMode, status, createdAt, successfulDownloads, reservedDownloads]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        accessMode:
          type: string
          enum: [public, private]
        status:
          type: string
          enum: [active, revoked, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        maxDownloads:
          type: [integer, 'null']
        successfulDownloads:
          type: integer
        reservedDownloads:
          type: integer
        revokedAt:
          type: [string, 'null']
          format: date-time
        createdBy:
          type: object
          properties:
            type:
              type: string
              enum: [user, admin]
            displayName:
              type: [string, 'null']

    LinkCreated:
      allOf:
        - $ref: '#/components/schemas/Link'
        - type: object
          required: [url, token]
          properties:
            url:
              type: string
              format: uri
              description: Full shareable URL (`/d/{token}`). The key is never in the URL.
            token:
              type: string
            downloadKey:
              type: [string, 'null']
              pattern: '^[A-Za-z0-9]{8}$'
              description: Public links only; shown exactly once at creation.
      description: |
        Returned only at creation. `downloadKey` cannot be retrieved later;
        revoke the link and create a new one to rotate it.

    LinkList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    LinkPublicInfo:
      type: object
      required: [requiresKey, requiresAuthentication]
      description: |
        Display metadata for a link. For a **private** link requested without
        authentication, only `requiresKey`/`requiresAuthentication` are returned;
        `fileName`, `sizeBytes`, `contentType`, `expiresAt`, and
        `remainingDownloads` are null so the file's existence is not disclosed.
        Authenticated users get the full object from `GET /v1/download-links/{token}`.
      properties:
        fileName:
          type: [string, 'null']
        sizeBytes:
          type: [integer, 'null']
          format: int64
        contentType:
          type: [string, 'null']
        requiresKey:
          type: boolean
        requiresAuthentication:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
        remainingDownloads:
          type: [integer, 'null']
        ownerDisplayName:
          type: [string, 'null']

    RedeemPublicLinkRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z0-9]{8}$'
          description: Case-sensitive 8-character download key.

    DownloadGrant:
      type: object
      required: [grantToken, expiresAt, downloadUrl]
      properties:
        grantToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        expiresAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          description: Relative URL to stream the file; single-use.

    LinkStats:
      type: object
      required: [linkId, successfulDownloads, reservedDownloads, failedAttempts]
      properties:
        linkId:
          type: string
          format: uuid
        successfulDownloads:
          type: integer
        reservedDownloads:
          type: integer
        failedAttempts:
          type: integer
        lastDownloadAt:
          type: [string, 'null']
          format: date-time
        recentEvents:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DownloadEvent'

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    Integration:
      type: object
      required: [id, slug, name, status, permissions, allowedIpCidrs, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        permissions:
          type: array
          items:
            type: string
            enum: [file.write, file.read, file.delete]
        allowedIpCidrs:
          type: array
          items:
            type: string
        entraClientId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disabledAt:
          type: [string, 'null']
          format: date-time
        disabledReason:
          type: [string, 'null']

    IntegrationList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Integration'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    CreateIntegrationRequest:
      type: object
      required: [slug, name, permissions]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            enum: [file.write, file.read, file.delete]
        allowedIpCidrs:
          type: array
          items:
            type: string
        entraClientId:
          type: [string, 'null']
          format: uuid

    UpdateIntegrationRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        status:
          type: string
          enum: [active, disabled]
        allowedIpCidrs:
          type: array
          items:
            type: string
        entraClientId:
          type: [string, 'null']
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Required when disabling or clearing the Entra client ID.

    SetPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            enum: [file.write, file.read, file.delete]

    Credential:
      type: object
      required: [id, integrationId, credentialType, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        integrationId:
          type: string
          format: uuid
        credentialType:
          type: string
          enum: [api_key, entra_client]
        name:
          type: string
        keyId:
          type: [string, 'null']
        keyPrefix:
          type: [string, 'null']
        expiresAt:
          type: [string, 'null']
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Credential'

    IssuedCredential:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Full API key (`flk_...`). Shown exactly once.
      description: Returned only on issuance; the secret cannot be retrieved again.

    IssueCredentialRequest:
      type: object
      required: [credentialType, name]
      properties:
        credentialType:
          type: string
          enum: [api_key, entra_client]
        name:
          type: string
          minLength: 1
          maxLength: 120
        expiresAt:
          type: [string, 'null']
          format: date-time
        entraClientId:
          type: [string, 'null']
          format: uuid
          description: Required for `entra_client`.
        rotateFromId:
          type: [string, 'null']
          format: uuid

    FileGrant:
      type: object
      required: [id, fileId, integrationId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        integrationId:
          type: string
          format: uuid
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    FileGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileGrant'

    CreateFileGrantRequest:
      type: object
      required: [integrationId]
      properties:
        integrationId:
          type: string
          format: uuid
        expiresAt:
          type: [string, 'null']
          format: date-time

    Availability:
      type: object
      required: [fileId, state, checkedAt]
      properties:
        fileId:
          type: string
          format: uuid
        state:
          type: string
          enum: [available, unavailable]
        sizeBytes:
          type: [integer, 'null']
          format: int64
        expiresAt:
          type: [string, 'null']
          format: date-time
        scanStatus:
          type: string
          enum: [not_scanned, pending, clean, infected, failed]
        checkedAt:
          type: string
          format: date-time

    RetentionPolicy:
      type: object
      required: [id, defaultDays, maxDays, allowUserOverride, allowIndefinite, publicLinksEnabled, isActive, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        defaultDays:
          type: integer
        maxDays:
          type: integer
        allowUserOverride:
          type: boolean
        allowIndefinite:
          type: boolean
        publicLinksEnabled:
          type: boolean
        isActive:
          type: boolean
        effectiveFrom:
          type: string
          format: date-time
        notes:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    RetentionPolicyHistory:
      type: object
      required: [current, history]
      properties:
        current:
          $ref: '#/components/schemas/RetentionPolicy'
        history:
          type: array
          items:
            $ref: '#/components/schemas/RetentionPolicy'

    CreateRetentionPolicyRequest:
      type: object
      required: [defaultDays, maxDays, allowUserOverride, allowIndefinite, publicLinksEnabled, reason]
      properties:
        defaultDays:
          type: integer
          minimum: 1
          maximum: 36500
        maxDays:
          type: integer
          minimum: 1
          maximum: 36500
        allowUserOverride:
          type: boolean
        allowIndefinite:
          type: boolean
        publicLinksEnabled:
          type: boolean
        notes:
          type: string
          maxLength: 1000
        reason:
          type: string
          minLength: 10
          maxLength: 500

    AdminRetentionOverrideRequest:
      type: object
      required: [mode, reason]
