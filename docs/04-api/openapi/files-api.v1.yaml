          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        targetPolicyId:
          type: string
          format: uuid
        scope:
          type: object
          additionalProperties: true
        totalFiles:
          type: integer
          format: int64
        processedFiles:
          type: integer
          format: int64
        failedFiles:
          type: integer
          format: int64
        lastError:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time

    CreateRetentionMigrationRequest:
      type: object
      required: [targetPolicyId, reason]
      properties:
        targetPolicyId:
          type: string
          format: uuid
        scope:
          type: object
          additionalProperties: true
          description: Optional owner/status/created filters.
        reason:
          type: string
          minLength: 10
          maxLength: 500

    NotificationPolicy:
      type: object
      required: [id, name, intervalsDays, templateKey, isActive, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        intervalsDays:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: integer
            minimum: 1
            maximum: 365
        templateKey:
          type: string
        isActive:
          type: boolean
        effectiveFrom:
          type: string
          format: date-time

    UpdateNotificationPolicyRequest:
      type: object
      required: [name, intervalsDays, templateKey, reason]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        intervalsDays:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: integer
            minimum: 1
            maximum: 365
        templateKey:
          type: string
        reason:
          type: string
          minLength: 10
          maxLength: 500

    EmailTemplate:
      type: object
      required: [id, key, locale, subject, bodyHtml, bodyText, version, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        locale:
          type: string
        subject:
          type: string
        bodyHtml:
          type: string
        bodyText:
          type: string
        version:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EmailTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmailTemplate'

    UpsertEmailTemplateRequest:
      type: object
      required: [subject, bodyHtml, bodyText, reason]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        bodyHtml:
          type: string
          minLength: 1
        bodyText:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500

    AuditEvent:
      type: object
      required: [id, category, actorType, action, result, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [file, admin]
        fileId:
          type: [string, 'null']
          format: uuid
        actorType:
          type: string
          enum: [user, integration, admin, system]
        actorId:
          type: [string, 'null']
          format: uuid
        action:
          type: string
        result:
          type: string
          enum: [success, failure]
        reason:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        traceId:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time

    AuditEventList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    DownloadEvent:
      type: object
      required: [id, actorType, source, result, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: [string, 'null']
          format: uuid
        linkId:
          type: [string, 'null']
          format: uuid
        actorType:
          type: string
          enum: [user, integration, anonymous, system]
        actorId:
          type: [string, 'null']
          format: uuid
        source:
          type: string
          enum: [owner, private_link, public_link, integration]
        result:
          type: string
          enum: [authorized, denied, completed, failed]
        reasonCode:
          type: [string, 'null']
        bytesSent:
          type: integer
          format: int64
        traceId:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time

    DownloadEventList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DownloadEvent'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    UsageStats:
      type: object
      required: [generatedAt, storage, files, downloads]
      properties:
        generatedAt:
          type: string
          format: date-time
        storage:
          type: object
          required: [totalBytes]
          properties:
            totalBytes:
              type: integer
              format: int64
            byOwnerType:
              type: object
              properties:
                human:
                  type: integer
                  format: int64
                integration:
                  type: integer
                  format: int64
        files:
          type: object
          properties:
            total:
              type: integer
              format: int64
            available:
              type: integer
              format: int64
            expired:
              type: integer
              format: int64
            pendingDeletion:
              type: integer
              format: int64
        downloads:
          type: object
          properties:
            last30Days:
              type: integer
              format: int64
            last7Days:
              type: integer
              format: int64
        integrations:
          type: array
          items:
            type: object
            properties:
              integrationId:
                type: string
                format: uuid
              name:
                type: string
              files:
                type: integer
                format: int64
              bytes:
                type: integer
                format: int64

    PlatformSettings:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
          description: Key/value settings (booleans, numbers, or strings).

    UpdatePlatformSettingsRequest:
      type: object
      required: [settings, reason]
      properties:
        settings:
          type: object
          additionalProperties: true
        reason:
          type: string
          minLength: 10
          maxLength: 500

    DeletionAccepted:
      type: object
      required: [fileId, status]
      properties:
        fileId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_deletion]
        requestedAt:
          type: string
          format: date-time
