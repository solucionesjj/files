openapi: 3.1.0
info:
  title: Files API
  version: 1.0.0
  description: |
    Secure file storage, transfer, and integration API.

    Authentication:
    - Portal users: Microsoft Entra ID delegated bearer token (`userAuth`).
    - Integrations: Entra ID client-credentials bearer token or API key (`integrationAuth`).
    - Public link visitors: link token + separate 8-character download key.

    All errors use RFC 9457 `application/problem+json` with a stable `code`.
    Downloads are streamed by the API; public/private/owner downloads require a
    short-lived, single-use grant. See `docs/04-api/api-conventions.md`.
  contact:
    name: Files Platform Team
  license:
    name: Proprietary
    url: https://files.example.com/terms

servers:
  - url: https://files.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Meta
    description: Identity and portal bootstrap endpoints.
  - name: Portal files
    description: Human-owned file management.
  - name: Portal links
    description: Link creation, revocation, and statistics.
  - name: Public links
    description: Anonymous link metadata and key redemption.
  - name: Downloads
    description: Short-lived grants and content streaming.
  - name: Integrations
    description: Machine-to-machine upload, retrieval, and deletion.
  - name: Admin
    description: Integrations, credentials, policies, and settings.
  - name: Audit
    description: Audit events and usage reporting.

security:
  - userAuth: []

paths:
  /config:
    get:
      tags: [Meta]
      operationId: getPortalConfig
      summary: Portal bootstrap configuration
      security: []
      responses:
        '200':
          description: Public, non-sensitive configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalConfig'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [Meta]
      operationId: getMe
      summary: Current identity and permissions
      responses:
        '200':
          description: Effective identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portal/files:
    get:
      tags: [Portal files]
      operationId: listMyFiles
      summary: Search and list files owned by the caller
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive partial filename match.
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Repeatable; files must have all provided tags.
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [pending_upload, processing, available, quarantined, expired, pending_deletion, deleted, upload_failed]
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, name, -name, downloads, -downloads]
            default: -created_at
        - name: expiringWithinDays
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3650
        - name: expiresBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: expiresAfter
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of files.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /portal/upload-sessions:
    post:
      tags: [Portal files]
      operationId: createPortalUploadSession
      summary: Create an upload session for a human-owned file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '201':
          description: Upload session created. `parts` may be a first batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Declared size exceeds the maximum.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /portal/upload-sessions/{sessionId}/parts:
    post:
      tags: [Portal files]
      operationId: presignPortalUploadParts
      summary: Get presigned URLs for additional parts
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignPartsRequest'
      responses:
        '200':
          description: Presigned part URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedParts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portal/upload-sessions/{sessionId}/complete:
    post:
      tags: [Portal files]
      operationId: completePortalUpload
      summary: Verify and complete an upload
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: File verified (available, or processing while scanning).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portal/upload-sessions/{sessionId}:
    delete:
      tags: [Portal files]
      operationId: abortPortalUpload
      summary: Abort an upload session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Aborted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /portal/files/{fileId}:
    get:
      tags: [Portal files]
      operationId: getMyFile
      summary: Get file metadata
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Portal files]
      operationId: updateMyFile
      summary: Rename, retag, or change retention
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileRequest'
      responses:
        '200':
          description: Updated file metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Portal files]
      operationId: deleteMyFile
      summary: Delete a file (logical immediately, physical asynchronously)
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: File no longer accessible; physical deletion queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /portal/files/{fileId}/downloads:
    post:
      tags: [Downloads]
      operationId: createOwnerDownloadGrant
      summary: Issue a short-lived download grant for the owner
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '201':
          description: Grant issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /portal/files/{fileId}/links:
    get:
      tags: [Portal links]
      operationId: listFileLinks
      summary: List links for a file
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Links (tokens are not returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Portal links]
      operationId: createLink
      summary: Create a public or private link
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created. The download key is returned only now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /portal/links:
    get:
      tags: [Portal links]
      operationId: listMyLinks
      summary: List links created by the caller
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, revoked, expired]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portal/links/{linkId}:
    delete:
      tags: [Portal links]
      operationId: revokeLink
      summary: Revoke a link
      parameters:
        - $ref: '#/components/parameters/LinkId'
        - name: reason
          in: query
          schema:
            type: string
            maxLength: 500
      responses:
        '204':
          description: Revoked; unused grants become invalid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /portal/links/{linkId}/stats:
    get:
      tags: [Portal links]
      operationId: getLinkStats
      summary: Download statistics for a link
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /portal/tags:
    get:
      tags: [Portal files]
      operationId: listTags
      summary: Reusable tag suggestions
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Tags visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /public/download-links/{token}:
    get:
      tags: [Public links]
      operationId: getPublicLink
      summary: Public link landing metadata
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      responses:
        '200':
          description: Non-sensitive display metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPublicInfo'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/download-links/{token}/downloads:
    post:
      tags: [Public links]
      operationId: redeemPublicLink
      summary: Verify the download key and issue a grant
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemPublicLinkRequest'
      responses:
        '201':
          description: Grant issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Invalid token, key, expired/revoked link, limit reached, or file unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /download-links/{token}:
    get:
      tags: [Public links]
      operationId: getPrivateLinkMetadata
      summary: Metadata for a private link (authenticated)
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      responses:
        '200':
          description: Full display metadata for an authenticated tenant user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPublicInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /download-links/{token}/downloads:
    post:
      tags: [Public links]
      operationId: redeemPrivateLink
      summary: Authenticate and issue a grant for a private link
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      responses:
        '201':
          description: Grant issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /download-grants/{grantToken}:
    get:
      tags: [Downloads]
      operationId: streamDownloadGrant
      summary: Stream the file authorized by a grant
      security: []
      parameters:
        - $ref: '#/components/parameters/GrantToken'
      responses:
        '200':
          description: File content.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown, expired, consumed, or invalidated grant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /integrations/upload-sessions:
    post:
      tags: [Integrations]
      operationId: createIntegrationUploadSession
      summary: Create an upload session owned by the integration
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationUploadSessionRequest'
      responses:
        '201':
          description: Upload session created (indefinite retention, integration-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /integrations/upload-sessions/{sessionId}/parts:
    post:
      tags: [Integrations]
      operationId: presignIntegrationUploadParts
      summary: Presign additional upload parts
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignPartsRequest'
      responses:
        '200':
          description: Presigned part URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedParts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /integrations/upload-sessions/{sessionId}/complete:
    post:
      tags: [Integrations]
      operationId: completeIntegrationUpload
      summary: Complete and verify an integration upload
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: File verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /integrations/upload-sessions/{sessionId}:
    delete:
      tags: [Integrations]
      operationId: abortIntegrationUpload
      summary: Abort an integration upload session
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Aborted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /integrations/files:
    get:
      tags: [Integrations]
      operationId: listIntegrationFiles
      summary: List files owned by the integration
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Owned files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Integrations]
      operationId: proxyUploadIntegrationFile
      summary: Upload a small file through the API (staging, <=100 MiB)
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                fileName:
                  type: string
                  maxLength: 512
                checksumSha256:
                  type: string
                  pattern: '^[a-fA-F0-9]{64}$'
                  description: Required for idempotent replay of a proxy upload.
      responses:
        '201':
          description: File staged, promoted, and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the proxy upload limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /integrations/files/{fileId}:
    get:
      tags: [Integrations]
      operationId: getIntegrationFile
      summary: Get metadata for an owned or granted file
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Integrations]
      operationId: deleteIntegrationFile
      summary: Delete an owned file
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: File no longer accessible; physical deletion queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /integrations/files/{fileId}/availability:
    get:
      tags: [Integrations]
      operationId: getIntegrationFileAvailability
      summary: Check availability without transferring content
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Availability state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /integrations/files/{fileId}/content:
    get:
      tags: [Integrations]
      operationId: downloadIntegrationFile
      summary: Download file content (supports Range)
      security:
        - integrationAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          description: Full content stream.
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/integrations:
    get:
      tags: [Admin]
