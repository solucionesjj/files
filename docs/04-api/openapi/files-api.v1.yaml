          minLength: 10
          maxLength: 500

    AdminDeleteFileRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500

    RetentionMigration:
      type: object
      required: [id, status, targetPolicyId, createdAt]
      properties:
        id:
